<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SURAU | Survival Automation</title>
    <link rel="icon" href="https://www.google.com/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="title-container">
        <h1>Surau</h1>
        <p
            style="color: var(--bronze-accent); letter-spacing: 2px; font-family: 'Marcellus', serif; font-size: 0.8rem;">
            Survival Automation v1.200</p>
    </div>

    <div class="dashboard-layout">
        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Profile Management -->
            <div class="card">
                <div class="card-header">
                    <h2>Profile Management</h2>
                </div>
                <div class="inline-form">
                    <label>Quantity:</label>
                    <input id="count" type="number" value="5" min="1" max="24" style="width: 60px;" />
                    <button class="btn-primary" onclick="createProfiles()">Create</button>
                    <button class="btn-danger" onclick="deleteAllProfiles()">Purge All</button>
                </div>
            </div>

            <!-- Browser Control -->
            <div class="card">
                <div class="card-header">
                    <h2>Browser Control</h2>
                    <div class="status-group" style="display: flex; gap: 5px;">
                        <span id="profileStatus" class="status-badge status-waiting">Inactive</span>
                        <span id="sheetStatus" class="status-badge status-waiting">No Data</span>
                    </div>
                </div>
                <div class="button-group">
                    <button class="btn-success" onclick="startAllProfiles()">▶ Launch</button>
                    <button class="btn-warning" onclick="closeAllProfiles()">⏹ Cease</button>
                    <button class="btn-info" onclick="getSheetData()">Sync Sheet</button>
                    <button id="btnCapMonsterMode" class="btn-warning" onclick="toggleCapMonsterMode()">
                        RC2: <span id="capMonsterModeText">Click</span>
                    </button>
                    <button id="btnCapMonsterEnterpriseMode" class="btn-warning"
                        onclick="toggleCapMonsterEnterpriseMode()">
                        RCE: <span id="capMonsterEnterpriseModeText">Click</span>
                    </button>
                    <button id="btnCapMonsterOnOff" class="btn-success" onclick="toggleCapMonsterOnOff()">
                        ON
                    </button>
                    <button id="btnStopAutomation" class="btn-danger" style="border-width: 2px;"
                        onclick="stopAutomation()" disabled>⏸ Pause</button>
                    <button class="btn-purify" onclick="freeRam()" title="Force kill all browser processes & clear state">🚀 RAM Purge</button>
                </div>
            </div>

            <!-- Automations -->
            <div class="card">
                <div class="card-header">
                    <h2>Automations</h2>
                </div>
                <div class="button-group">
                    <button id="btnLoginGoogle" class="btn-special" onclick="runLoginGoogle()">Login Google</button>
                    <button id="btnLoginCaptchaRetry" class="btn-success" onclick="runLoginCaptchaRetry()">Login + Solve
                        Captcha</button>
                    <button id="btnPasswordGoogle" class="btn-special" onclick="runPasswordGoogle()">Password
                        Google</button>
                    <button id="btnVerifyPhoneSheet" class="btn-primary" onclick="runVerifyPhoneSheet()">Verify Phone
                        Sheet</button>
                    <button id="btnVerifyPhoneSheetCheck" class="btn-warning"
                        onclick="runVerifyPhoneSheetCheck()">Double verify phone sheet</button>
                    <button id="btnAppealGoogle" class="btn-warning" onclick="runAppealGoogle()">Appeal Google</button>
                    <button id="btnSetup2FA" class="btn-info" onclick="runSetup2FA()">Setup 2FA</button>
                    <button id="btnSolveCaptcha" class="btn-primary" onclick="runSolveCaptcha()">Solve Captcha
                        Solo</button>
                    <button id="btnSolveCaptchaContinuous" class="btn-success"
                        onclick="toggleSolveCaptchaContinuous()">Continuous Captcha Solve</button>
                    <button id="btnLogoutGoogle" class="btn-danger" onclick="runLogoutGoogle()">Logout Google</button>
                </div>
            </div>

            <!-- Validation Queue -->
            <div class="card">
                <div class="card-header">
                    <h2>Validation Queue</h2>
                    <div class="status-group">
                        <span id="queueStatus" class="status-badge status-waiting">Empty</span>
                    </div>
                </div>
                <div class="button-group">
                    <button id="btnLoadQueue" class="btn-success" onclick="loadOrResetQueue()">check phone
                        verify</button>
                    <button class="btn-info" onclick="showQueueStatus()">Stats</button>
                </div>
            </div>

            <!-- Proxy Management -->
            <div class="card">
                <div class="card-header">
                    <h2>Proxy Management</h2>
                    <div class="status-group">
                        <span id="activeProxyBadge" class="status-badge status-ready">Proxy 1</span>
                    </div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <div class="inline-form">
                        <label style="width: 60px;">Proxy 1:</label>
                        <input id="proxy1" type="text" placeholder="host:port:user:pass" style="flex: 1;" />
                        <button class="btn-primary" onclick="switchProxy(1)" id="btnProxy1">Use P1</button>
                    </div>
                    <div class="inline-form">
                        <label style="width: 60px;">Proxy 2:</label>
                        <input id="proxy2" type="text" placeholder="host:port:user:pass" style="flex: 1;" />
                        <button class="btn-primary" onclick="switchProxy(2)" id="btnProxy2">Use P2</button>
                    </div>
                    <div class="inline-form">
                        <label style="width: 60px;">Proxy Captcha:</label>
                        <input id="captchaProxy" type="text" placeholder="Static proxy for CapMonster (optional)" style="flex: 1; border-color: #ffd700;" title="Bỏ trống để dùng proxy 1/2 hiện tại có Mutex. Điền tĩnh để giải tốc độ cao Multi-thread." />
                    </div>
                    <div class="inline-form">
                        <label style="width: 60px;">Xoay:</label>
                        <input id="rotateUrl" type="text" placeholder="Link API xoay proxy" style="flex: 1;" />
                        <button class="btn-warning" onclick="rotateProxy()" id="btnRotate">🔄 Xoay Proxy</button>
                    </div>
                    <div class="button-group">
                        <button class="btn-info" onclick="saveProxyConfig()">Commit Config</button>
                        <button class="btn-success" onclick="loadProxyConfig()">Reload</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sidebar Panel for Results -->
        <div class="side-panel">
            <div class="card result-outer">
                <div class="card-header">
                    <h2>Live Results</h2>
                </div>
                <pre id="result" class="result-inner">Awaiting operations...</pre>
            </div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:3500';
        window.openedProfiles = [];
        window.sheetRows = [];

        async function restoreState() {
            try {
                const res = await fetch(`${API}/profiles/state`);
                const data = await res.json();
                if (data.profiles && data.profiles.length > 0) {
                    window.openedProfiles = data.profiles;
                    updateStatus();
                }

                // Sync frontend button states with backend active tasks
                try {
                    const statusRes = await fetch(`${API}/automation/status`);
                    const statusData = await statusRes.json();
                    
                    if (statusData.runningTasks && statusData.runningTasks['solve-captcha-continuous']) {
                        continuousCaptchaEnabled = true;
                        const btn = document.getElementById('btnSolveCaptchaContinuous');
                        if (btn) {
                            btn.classList.remove('btn-success');
                            btn.classList.add('btn-warning');
                            btn.innerHTML = 'CONTINUOUS CAPTCHA: ON';
                        }
                    }
                } catch (e) {}
                
            } catch (err) { }
        }

        restoreState();

        let capMonsterMode = 'Click';
        async function toggleCapMonsterMode() {
            if (window.openedProfiles.length === 0) return alert('No active profiles.');
            capMonsterMode = capMonsterMode === 'Token' ? 'Click' : 'Token';
            document.getElementById('capMonsterModeText').textContent = capMonsterMode;
            try {
                await fetch(`${API}/automation/capmonster/${capMonsterMode.toLowerCase()}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ profiles: window.openedProfiles.map(p => ({ profileId: p.profile_id, remoteDebugAddress: p.remote_debugging_address })) }),
                });
                show(`RC2 mode: ${capMonsterMode}`);
            } catch (err) { show('Error: ' + err.message); }
        }

        let capMonsterEnterpriseMode = 'Click';
        async function toggleCapMonsterEnterpriseMode() {
            if (window.openedProfiles.length === 0) return alert('No active profiles.');
            capMonsterEnterpriseMode = capMonsterEnterpriseMode === 'Token' ? 'Click' : 'Token';
            document.getElementById('capMonsterEnterpriseModeText').textContent = capMonsterEnterpriseMode;
            try {
                await fetch(`${API}/automation/capmonster/enterprise/${capMonsterEnterpriseMode.toLowerCase()}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ profiles: window.openedProfiles.map(p => ({ profileId: p.profile_id, remoteDebugAddress: p.remote_debugging_address })) }),
                });
                show(`RCE mode: ${capMonsterEnterpriseMode}`);
            } catch (err) { show('Error: ' + err.message); }
        }

        let capMonsterEnabled = true;
        async function toggleCapMonsterOnOff() {
            if (window.openedProfiles.length === 0) return alert('No active profiles.');
            capMonsterEnabled = !capMonsterEnabled;
            const btn = document.getElementById('btnCapMonsterOnOff');
            btn.textContent = capMonsterEnabled ? 'ON' : 'OFF';
            btn.className = capMonsterEnabled ? 'btn-success' : 'btn-danger';
            try {
                await fetch(`${API}/automation/capmonster/${capMonsterEnabled ? 'enable' : 'disable'}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ profiles: window.openedProfiles.map(p => ({ profileId: p.profile_id, remoteDebugAddress: p.remote_debugging_address })) }),
                });
                show(`CapMonster: ${capMonsterEnabled ? 'Active' : 'Disabled'}`);
            } catch (err) { show('Error: ' + err.message); }
        }

        function show(data, append = false) {
            const resBox = document.getElementById('result');
            let content = '';

            if (data && typeof data === 'object' && data.results) {
                const successMsg = `✅ Success: ${data.results.filter(r => r.success).length} | ❌ Failed: ${data.results.filter(r => !r.success).length}\n\n`;
                content = successMsg + data.results.map(r => `${r.success ? '✓' : '✗'} [${r.profileId}] ${r.data?.gmail || ''}: ${r.data?.message || r.error || ''}`).join('\n');
            } else {
                content = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
            }

            if (append) {
                resBox.textContent += (resBox.textContent ? '\n' : '') + content;
            } else {
                resBox.textContent = content;
            }

            // Auto scroll to bottom
            resBox.scrollTop = resBox.scrollHeight;
        }

        // Live Log Stream
        const eventSource = new EventSource(`${API}/log-stream/stream`);
        eventSource.onmessage = (event) => {
            try {
                const log = JSON.parse(event.data);
                const colorMap = {
                    'info': '#00ff88',
                    'success': '#4CAF50',
                    'warning': '#FFC107',
                    'error': '#ff4d4d'
                };
                // For simplicity in the pre tag, we just append text. 
                // If we want colors, we'd need to use innerHTML with spans.
                // Keeping it minimalist as requested.
                show(`[${log.timestamp}] ${log.message}`, true);
            } catch (e) {
                console.error('SSE Error:', e);
            }
        };

        function updateStatus() {
            const pStatus = document.getElementById('profileStatus');
            const sStatus = document.getElementById('sheetStatus');
            pStatus.textContent = window.openedProfiles.length > 0 ? `Active: ${window.openedProfiles.length}` : 'Inactive';
            pStatus.className = window.openedProfiles.length > 0 ? 'status-badge status-ready' : 'status-badge status-waiting';
            sStatus.textContent = window.sheetRows.length > 0 ? `Rows: ${window.sheetRows.length}` : 'No Data';
            sStatus.className = window.sheetRows.length > 0 ? 'status-badge status-ready' : 'status-badge status-waiting';
        }

        async function createProfiles() {
            const count = Number(document.getElementById('count').value);
            show(`Initializing ${count} profiles...`);
            try {
                const res = await fetch(`${API}/profiles/create`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ count }) });
                show(await res.json());
            } catch (err) { show('Error: ' + err.message); }
        }

        async function deleteAllProfiles() {
            if (!confirm('Purge all data?')) return;
            try {
                await fetch(`${API}/profiles/delete-all`, { method: 'DELETE' });
                window.openedProfiles = [];
                updateStatus();
                show('Purge complete.');
            } catch (err) { show('Error: ' + err.message); }
        }

        async function startAllProfiles() {
            show('Launching browsers... (Vui lòng đợi khoảng 20-30s)');
            try {
                const res = await fetch(`${API}/profiles/start-all`, { method: 'POST' });
                const data = await res.json();
                window.openedProfiles = data.profiles || [];
                updateStatus();
                show(`Launched ${window.openedProfiles.length} profiles.`);

                // Tự động bật Continuous Captcha Solve ngầm sau khi mở profile
                if (window.openedProfiles.length > 0) {
                    continuousCaptchaEnabled = true;
                    const btn = document.getElementById('btnSolveCaptchaContinuous');
                    if (btn) {
                        btn.classList.remove('btn-success');
                        btn.classList.add('btn-warning');
                        btn.innerHTML = 'CONTINUOUS CAPTCHA: ON';
                    }

                    const sortedProfiles = [...window.openedProfiles].sort((a, b) => parseInt(a.profile_id) - parseInt(b.profile_id));
                    const jobs = sortedProfiles.map((p, i) => ({
                        profileId: p.profile_id,
                        remoteDebugAddress: p.remote_debugging_address,
                        sheetRow: window.sheetRows[i]
                    }));

                    show(`Auto-start Continuous Captcha trên ${jobs.length} profiles...`, true);
                    fetch(`${API}/automation/run`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ automation: 'solve-captcha-continuous', profiles: jobs }),
                    }).then(async r => show(await r.json())).catch(err => show('Continuous Error: ' + err.message));
                }
            } catch (err) { show('Error: ' + err.message); }
        }

        async function closeAllProfiles() {
            show('Stopping all automations...');
            try {
                // 1. Dừng TẤT CẢ automation đang chạy ngầm TRƯỚC
                await fetch(`${API}/automation/stop`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({}),
                });

                // Reset toggle UI
                continuousCaptchaEnabled = false;
                const btn = document.getElementById('btnSolveCaptchaContinuous');
                if (btn) {
                    btn.classList.remove('btn-warning');
                    btn.classList.add('btn-success');
                    btn.innerHTML = 'Continuous Captcha Solve';
                }
            } catch (e) { }

            // 2. Đợi 1s cho abort signal lan truyền xong
            await new Promise(r => setTimeout(r, 1000));

            show('Ceasing browsers...');
            try {
                await fetch(`${API}/profiles/close-all`, { method: 'POST' });
                window.openedProfiles = [];
                updateStatus();
                show('System shutdown.');
            } catch (err) { show('Error: ' + err.message); }
        }

        async function freeRam() {
            if (!confirm('This will FORCE CLOSE all browsers and stop all automations. Are you sure?')) return;
            
            show('🚀 Commencing System Purge...');
            try {
                const res = await fetch(`${API}/profiles/free-ram`, { method: 'POST' });
                const data = await res.json();
                
                window.openedProfiles = [];
                updateStatus();
                
                // Reset UI buttons
                continuousCaptchaEnabled = false;
                const btn = document.getElementById('btnSolveCaptchaContinuous');
                if (btn) {
                    btn.classList.remove('btn-warning');
                    btn.classList.add('btn-success');
                    btn.innerHTML = 'Continuous Captcha Solve';
                }
                
                show(`✅ ${data.message || 'System purged successfully.'}`);
            } catch (err) { 
                show('Purge Error: ' + err.message); 
            }
        }

        async function getSheetData() {
            show('Syncing sheet...');
            try {
                const res = await fetch(`${API}/sheet/rows`);
                const data = await res.json();
                window.sheetRows = data.rows || [];
                updateStatus();
                show(`Sync complete. Loaded ${window.sheetRows.length} rows.`);
            } catch (err) { show('Error: ' + err.message); }
        }

        async function runAutomation(type) {
            if (window.openedProfiles.length === 0) return alert('No active profiles.');
            if (window.sheetRows.length === 0 && !['solve-captcha-api', 'solve-captcha-continuous', 'logout-google', 'setup-2fa', 'check-phone-verify'].includes(type)) return alert('No sheet data.');

            const sortedProfiles = [...window.openedProfiles].sort((a, b) => parseInt(a.profile_id) - parseInt(b.profile_id));
            const jobs = sortedProfiles.map((p, i) => ({
                profileId: p.profile_id,
                remoteDebugAddress: p.remote_debugging_address,
                sheetRow: window.sheetRows[i]
            }));

            show(`Executing ${type} on ${jobs.length} nodes...`);
            document.getElementById('btnStopAutomation').disabled = false;
            try {
                const res = await fetch(`${API}/automation/run`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ automation: type, profiles: jobs }),
                });
                show(await res.json());
            } catch (err) { show('Error: ' + err.message); }
            finally { document.getElementById('btnStopAutomation').disabled = true; }
        }

        // Mapping functions for legacy triggers
        window.runLoginGoogle = () => runAutomation('login-google');
        window.runLoginCaptchaRetry = () => runAutomation('login-captcha-retry');
        window.runPasswordGoogle = () => runAutomation('password-google');
        window.runVerifyPhoneSheet = () => runAutomation('verify-phone-sheet');
        window.runVerifyPhoneSheetCheck = () => runAutomation('verify-phone-sheet-check');
        window.runAppealGoogle = () => runAutomation('appeal-google');
        window.runLogoutGoogle = () => runAutomation('logout-google');
        window.runSetup2FA = () => runAutomation('setup-2fa');
        window.runSolveCaptcha = () => runAutomation('solve-captcha-api');

        let continuousCaptchaEnabled = false;
        window.toggleSolveCaptchaContinuous = async () => {
            const btn = document.getElementById('btnSolveCaptchaContinuous');
            
            if (!continuousCaptchaEnabled) {
                if (window.openedProfiles.length === 0) return alert('No active profiles.');
                
                continuousCaptchaEnabled = true;
                btn.classList.remove('btn-success');
                btn.classList.add('btn-warning');
                btn.innerHTML = 'CONTINUOUS CAPTCHA: ON';
                
                const sortedProfiles = [...window.openedProfiles].sort((a, b) => parseInt(a.profile_id) - parseInt(b.profile_id));
                const jobs = sortedProfiles.map((p, i) => ({
                    profileId: p.profile_id,
                    remoteDebugAddress: p.remote_debugging_address,
                    sheetRow: window.sheetRows[i]
                }));
                
                show(`Executing solve-captcha-continuous (Background) on ${jobs.length} nodes...`);
                // Run in background without blocking UI
                fetch(`${API}/automation/run`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ automation: 'solve-captcha-continuous', profiles: jobs }),
                }).then(async r => show(await r.json())).catch(err => show('Continuous Error: ' + err.message));
                
            } else {
                continuousCaptchaEnabled = false;
                btn.classList.remove('btn-warning');
                btn.classList.add('btn-success');
                btn.innerHTML = 'Continuous Captcha Solve';
                
                show('Stopping Continuous Captcha...');
                try {
                    await fetch(`${API}/automation/stop`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ type: 'solve-captcha-continuous' }),
                    });
                } catch(e) { }
            }
        };

        async function stopAutomation() {
            try {
                await fetch(`${API}/automation/stop`, { method: 'POST' });
                show('Process halted.');
            } catch (err) { show('Error: ' + err.message); }
        }

        // Proxy functions
        async function loadProxyConfig() {
            try {
                const res = await fetch(`${API}/proxy/config`);
                const data = await res.json();
                document.getElementById('proxy1').value = data.proxy1 || '';
                document.getElementById('proxy2').value = data.proxy2 || '';
                document.getElementById('captchaProxy').value = data.captchaProxy || '';
                document.getElementById('rotateUrl').value = data.rotateUrl || '';
                updateProxyUI(data.activeIndex);
            } catch (err) { }
        }
        loadProxyConfig();

        async function saveProxyConfig() {
            const proxy1 = document.getElementById('proxy1').value;
            const proxy2 = document.getElementById('proxy2').value;
            const captchaProxy = document.getElementById('captchaProxy').value;
            const rotateUrl = document.getElementById('rotateUrl').value;
            try {
                await fetch(`${API}/proxy/config`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ proxy1, proxy2, captchaProxy, rotateUrl }) });
                show('Configuration committed.');
            } catch (err) { show('Error: ' + err.message); }
        }

        async function rotateProxy() {
            try {
                await saveProxyConfig();
                show('🔄 Đang xoay proxy...');
                const res = await fetch(`${API}/proxy/rotate`, { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    show(`✅ Đã xoay proxy! ${data.message || ''}`);
                } else {
                    show(`❌ Lỗi xoay proxy: ${data.message || 'Unknown error'}`);
                }
            } catch (err) { show('Error: ' + err.message); }
        }

        async function switchProxy(index) {
            try {
                show(`Đang đổi sang Proxy ${index}...`);
                await saveProxyConfig();
                await fetch(`${API}/proxy/switch`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ index }), cache: 'no-cache' });
                const res = await fetch(`${API}/proxy/config`);
                const data = await res.json();
                updateProxyUI(data.activeIndex);
                try {
                    const stateRes = await fetch(`${API}/profiles/state`);
                    const stateData = await stateRes.json();
                    window.openedProfiles = stateData.profiles || [];
                    updateStatus();
                } catch { }
                show(`✅ Đã đổi sang Proxy ${index}! Trang web trên Chrome sẽ tự reload với IP mới.`);
            } catch (err) { show('Error: ' + err.message); }
        }

        function updateProxyUI(idx) {
            const badge = document.getElementById('activeProxyBadge');
            badge.textContent = `Proxy ${idx}`;
            document.getElementById('btnProxy1').className = idx === 1 ? 'btn-success' : 'btn-primary';
            document.getElementById('btnProxy2').className = idx === 2 ? 'btn-success' : 'btn-primary';
        }

        async function loadOrResetQueue() {
            if (window.openedProfiles.length === 0) return alert('No active profiles.');
            show('Syncing queue...');
            try {
                const res = await fetch(`${API}/phone/queue/load`, { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    show(`Queue synchronized. Total: ${data.total}. Starting check-phone-verify...`);
                    document.getElementById('queueStatus').textContent = `✓ ${data.total}`;
                    document.getElementById('queueStatus').className = 'status-badge status-ready';
                    // Chạy automation check-phone-verify sau khi sync queue
                    await runAutomation('check-phone-verify');
                }
            } catch (err) { show('Error: ' + err.message); }
        }

        function showQueueStatus() {
            show('Queue stats requested.');
        }

    </script>
</body>

</html>
