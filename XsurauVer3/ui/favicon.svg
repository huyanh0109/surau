<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="loopyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180024"/>
      <stop offset="50%" stop-color="#080512"/>
      <stop offset="100%" stop-color="#001824"/>
    </linearGradient>
    <linearGradient id="pinkMagentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff00a0"/>
      <stop offset="50%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
    <linearGradient id="cyanNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <filter id="loopyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Cyber Circle Frame -->
  <circle cx="50" cy="50" r="45" fill="url(#loopyBg)" stroke="url(#pinkMagentaGrad)" stroke-width="3.5" filter="url(#loopyGlow)"/>
  <circle cx="50" cy="50" r="39" fill="none" stroke="url(#cyanNeonGrad)" stroke-width="1.2" opacity="0.6" stroke-dasharray="6,3"/>

  <!-- Iconic Loopy Infinity Loop Shape -->
  <path d="M 32,50 C 22,36 18,64 32,64 C 44,64 56,36 68,36 C 82,36 78,64 68,50 C 56,36 44,64 32,50 Z" 
        fill="none" stroke="url(#pinkMagentaGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#loopyGlow)" />
  
  <path d="M 32,50 C 22,36 18,64 32,64 C 44,64 56,36 68,36 C 82,36 78,64 68,50 C 56,36 44,64 32,50 Z" 
        fill="none" stroke="url(#cyanNeonGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Central 'L' Cyber Core Accent -->
  <path d="M 45,34 L 45,62 L 60,62" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#loopyGlow)" />

  <!-- Orbit Tech Particles -->
  <circle cx="28" cy="42" r="2.5" fill="#ff00a0"/>
  <circle cx="72" cy="58" r="2.5" fill="#00f0ff"/>
  <circle cx="50" cy="17" r="2.5" fill="#ffe066"/>
</svg>
